name: Mobile Android Latest Preview

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-android-latest.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit SHA to build'
        required: false
        default: 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-preview:
    name: Build & Publish Android Preview APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          fetch-depth: 1

      - name: Read commit details
        id: commit_info
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "commit_msg<<EOF" >> "$GITHUB_OUTPUT"
          echo "$COMMIT_MSG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Fail-fast check
        run: |
          npm ci --ignore-scripts
          cd apps/mobile
          npx tsc --noEmit

      - name: Set up Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build with EAS in the cloud
        id: eas_build
        working-directory: apps/mobile
        run: |
          echo "Triggering EAS cloud preview build..."
          eas build --platform android --profile preview --non-interactive --wait --json > eas-build-output.json

          # Print output for logs
          cat eas-build-output.json

          # Extract build ID and artifact download link
          BUILD_ID=$(jq -r '(if type=="array" then .[0] else . end) | .id // empty' eas-build-output.json)
          APK_URL=$(jq -r '(if type=="array" then .[0] else . end) | .artifacts.applicationArchiveUrl // .artifacts.buildUrl // empty' eas-build-output.json)

          if [ -z "$APK_URL" ]; then
            echo "::error::No APK artifact URL found in EAS build output."
            exit 1
          fi

          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"

      - name: Download APK artifact
        run: |
          SHORT_SHA="${{ steps.commit_info.outputs.short_sha }}"
          APK_URL="${{ steps.eas_build.outputs.apk_url }}"

          echo "Downloading APK from: $APK_URL"
          curl -L -fail -o "TruTicket-${SHORT_SHA}.apk" "$APK_URL"

          if [ ! -s "TruTicket-${SHORT_SHA}.apk" ]; then
            echo "::error::Downloaded APK is missing or empty."
            exit 1
          fi

          # Also keep TruTicket.apk as standard named copy
          cp "TruTicket-${SHORT_SHA}.apk" TruTicket.apk
          echo "APK downloaded successfully ($(du -h TruTicket.apk | cut -f1))"

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest-android"
          TITLE="TruTicket Android Preview (latest)"
          SHORT_SHA="${{ steps.commit_info.outputs.short_sha }}"
          COMMIT_SHA="${{ steps.commit_info.outputs.commit_sha }}"
          COMMIT_MSG="${{ steps.commit_info.outputs.commit_msg }}"
          BUILD_ID="${{ steps.eas_build.outputs.build_id }}"
          BUILD_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          cat <<EOF > release_notes.md
          ## TruTicket Android Preview

          Latest preview build from commit \`${SHORT_SHA}\`.

          - **Commit SHA:** \`${COMMIT_SHA}\` (\`${SHORT_SHA}\`)
          - **Commit Message:** ${COMMIT_MSG}
          - **Build Time:** ${BUILD_TIME}
          - **EAS Build ID:** \`${BUILD_ID}\`

          ### 📥 Download APK
          - **[Download TruTicket.apk (Latest)](https://github.com/${{ github.repository }}/releases/download/${TAG}/TruTicket.apk)**
          - **[Download TruTicket-${SHORT_SHA}.apk (Archived build)](https://github.com/${{ github.repository }}/releases/download/${TAG}/TruTicket-${SHORT_SHA}.apk)**

          ### 📖 Installation Guide
          See the [Android Install Guide](https://github.com/${{ github.repository }}/blob/main/docs/ANDROID_INSTALL.md) for installation steps and troubleshooting.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Updating release notes and uploading assets..."
            gh release edit "$TAG" --title "$TITLE" --notes-file release_notes.md --latest
            gh release upload "$TAG" TruTicket.apk "TruTicket-${SHORT_SHA}.apk" --clobber
          else
            echo "Release $TAG does not exist. Creating new release..."
            gh release create "$TAG" TruTicket.apk "TruTicket-${SHORT_SHA}.apk" \
              --title "$TITLE" \
              --notes-file release_notes.md \
              --latest
          fi

      - name: Write summary
        run: |
          SHORT_SHA="${{ steps.commit_info.outputs.short_sha }}"
          BUILD_ID="${{ steps.eas_build.outputs.build_id }}"
          TAG="latest-android"

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 📱 TruTicket Android Preview Build Complete

          - **Commit:** \`${SHORT_SHA}\`
          - **EAS Build ID:** \`${BUILD_ID}\`
          - **Release Tag:** [\`${TAG}\`](https://github.com/${{ github.repository }}/releases/tag/${TAG})
          - **Direct APK Download:** [TruTicket.apk](https://github.com/${{ github.repository }}/releases/download/${TAG}/TruTicket.apk)
          - **Archived APK:** [TruTicket-${SHORT_SHA}.apk](https://github.com/${{ github.repository }}/releases/download/${TAG}/TruTicket-${SHORT_SHA}.apk)

          Friends can download and install directly on their Android devices using the [Android Install Guide](https://github.com/${{ github.repository }}/blob/main/docs/ANDROID_INSTALL.md).
          EOF
